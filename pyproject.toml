[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "PySonicAobanZ"
version = "1.0"
authors = [
  { name="AobanZ"},
]
description = "A statistical, low-memory AI-model pipeline for generation or tokenizing."
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

[project.urls]
Homepage = "https://github.com/AobanZ-MinecraftYoutuber/PySonic"
Issues = "https://github.com/AobanZ-MinecraftYoutuber/PySonic/issues"